[package]
name = "fengyitai"
version = "0.1.0"
edition = "2021"
description = "伏安峰议台 - 循环伏安基线/峰区间/峰对多方案分析本地服务"

[[bin]]
name = "fengyitai"
path = "src/main.rs"

[lib]
name = "fengyitai"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "net", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
lto = false

[[example]]
name = "scratch"
path = "examples/scratch.rs"

[[example]]
name="dbg"
path="examples/dbg.rs"

[[example]]
name="full"
path="examples/full.rs"

[[example]]
name="dbg2"
path="examples/dbg2.rs"
